<!doctype html>
<html lang="en">
  <head>
    <meta name="oval-snapshot" content="true" />
    <meta name="robots" content="noindex" />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#122b40" />
    <meta
      name="description"
      content="Explore official short-track results and verified race footage by athlete."
    />
    <title>Oval Index · Short-track race archive</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23132f45'/%3E%3Crect x='7' y='15' width='34' height='18' rx='9' transform='rotate(-24 24 24)' fill='none' stroke='%23c5f583' stroke-width='4'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./static/style.css" />
    <script type="module" src="./static/app.js"></script>
  </head>
  <body>
    <a href="#main" class="skip" data-i18n="跳到主要内容">Skip to content</a>
    <header class="mast">
      <div class="mast-in">
        <a
          class="brand"
          href="#profile"
          aria-label="Oval Index athlete profile"
          data-i18n-aria="Oval Index 个人档案"
          ><i aria-hidden="true"></i>Oval Index</a
        >
        <nav aria-label="Main navigation" data-i18n-aria="主导航">
          <a href="#profile" id="nav-profile" data-i18n="个人档案">Profile</a
          ><a href="#events" id="nav-events" data-i18n="赛事">Events</a>
          <a href="#feedback" id="nav-feedback" data-i18n="反馈">Feedback</a>
        </nav>
        <button class="switch" id="switch" type="button">
          <span data-icon="users"></span
          ><span data-i18n="切换选手">Switch athlete</span>
        </button>
        <button
          id="settings"
          type="button"
          class="icon-button settings"
          aria-label="System settings"
          title="System settings"
          data-i18n-aria="系统设置"
        >
          <span data-icon="settings"></span>
        </button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <p class="notice" data-i18n="正在读取比赛档案…">Loading race index…</p>
    </main>
    <dialog id="overlay" aria-labelledby="dialog-heading">
      <div class="dialog-head">
        <h2 id="dialog-heading"></h2>
        <button
          class="icon-button"
          id="close"
          type="button"
          aria-label="Close"
          data-i18n-aria="关闭"
        >
          <span data-icon="x"></span>
        </button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
    <div id="toast" role="status"></div>
  </body>
</html>
